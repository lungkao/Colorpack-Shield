PLG_SYSTEM_COLORPACK_SHIELD="System - Colorpack Shield WAF"
PLG_SYSTEM_COLORPACK_SHIELD_XML_DESCRIPTION="Colorpack Shield generic request WAF. Runs SQLi / XSS / LFI / RFI signature shields across the site, administrator, and API applications."

PLG_SYSTEM_COLORPACK_SHIELD_FS_COVERAGE="Application Coverage"
PLG_SYSTEM_COLORPACK_SHIELD_FS_SHIELDS="Shields"
PLG_SYSTEM_COLORPACK_SHIELD_FS_GEOIP="GeoIP"
PLG_SYSTEM_COLORPACK_SHIELD_FS_RATELIMIT="Rate Limiting"
PLG_SYSTEM_COLORPACK_SHIELD_FS_ADVANCED="Advanced"

PLG_SYSTEM_COLORPACK_SHIELD_GEO_ENABLED_LABEL="Enable GeoIP filtering"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_ENABLED_DESC="Block or allow requests by source country using a local MaxMind GeoLite2 database. Requires either the maxminddb PHP extension or the geoip2/geoip2 Composer package; if neither is present GeoIP is silently skipped (fail-open)."
PLG_SYSTEM_COLORPACK_SHIELD_GEO_DB_LABEL="GeoLite2 database path"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_DB_DESC="Absolute path to a local GeoLite2-Country.mmdb file, refreshed by your own cron. Lookups are local — no per-request network call."
PLG_SYSTEM_COLORPACK_SHIELD_GEO_MODE_LABEL="Mode"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_MODE_DESC="Deny mode blocks the listed countries. Allow mode blocks every country except the listed ones."
PLG_SYSTEM_COLORPACK_SHIELD_GEO_MODE_DENY="Deny listed countries"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_MODE_ALLOW="Allow only listed countries"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_COUNTRIES_LABEL="Countries"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_COUNTRIES_DESC="Comma-separated ISO 3166-1 alpha-2 codes, e.g. TH,SG,US."
PLG_SYSTEM_COLORPACK_SHIELD_GEO_UNKNOWN_LABEL="Allow unknown country"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_UNKNOWN_DESC="In allow mode, permit requests whose country cannot be resolved (private IPs, gaps in the database). Turn off to fail closed."
PLG_SYSTEM_COLORPACK_SHIELD_GEO_ALLOW_IPS_LABEL="IP allowlist (CIDR)"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_ALLOW_IPS_DESC="One IP or CIDR per line that always passes regardless of country (office IPs, monitoring probes). Highest precedence."
PLG_SYSTEM_COLORPACK_SHIELD_GEO_DENY_IPS_LABEL="IP denylist (CIDR)"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_DENY_IPS_DESC="One IP or CIDR per line that is always blocked, checked before the country rule."

PLG_SYSTEM_COLORPACK_SHIELD_RATE_ENABLED_LABEL="Enable rate limiting"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_ENABLED_DESC="Throttle requests per source IP using a fixed-window counter. Requires the APCu extension; if APCu is absent rate limiting is silently skipped (fail-open)."
PLG_SYSTEM_COLORPACK_SHIELD_RATE_WINDOW_LABEL="Window (seconds)"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_WINDOW_DESC="Length of the counting window in seconds."
PLG_SYSTEM_COLORPACK_SHIELD_RATE_LIMIT_LABEL="Requests per window"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_LIMIT_DESC="Maximum requests one IP may make per window before it receives HTTP 429. Counted separately per application and component."
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_THRESHOLD_LABEL="Ban after N violations"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_THRESHOLD_DESC="Number of soft 429 hits within the ban window before the IP is temporarily banned. Set to 0 to disable temp bans."
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_WINDOW_LABEL="Ban window (seconds)"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_WINDOW_DESC="Period over which violations are counted toward the ban threshold."
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_DURATION_LABEL="Ban duration (seconds)"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_DURATION_DESC="How long a temp-banned IP stays fully blocked."

PLG_SYSTEM_COLORPACK_SHIELD_COVER_SITE_LABEL="Protect front-end (site)"
PLG_SYSTEM_COLORPACK_SHIELD_COVER_SITE_DESC="Inspect requests to the public site application."
PLG_SYSTEM_COLORPACK_SHIELD_COVER_ADMIN_LABEL="Protect administrator"
PLG_SYSTEM_COLORPACK_SHIELD_COVER_ADMIN_DESC="Inspect requests to the administrator application. Closes the site-only gap left by most WAF extensions."
PLG_SYSTEM_COLORPACK_SHIELD_COVER_API_LABEL="Protect API"
PLG_SYSTEM_COLORPACK_SHIELD_COVER_API_DESC="Inspect requests to the Joomla web-services (api) application."

PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_ALLOWLIST_LABEL="Administrator allowlist"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_ALLOWLIST_DESC="Component options (one per line, e.g. com_colorpack_shield) that are exempt from WAF inspection in the administrator app, to avoid locking Super Users out of trusted components whose settings legitimately contain regex-like values."

PLG_SYSTEM_COLORPACK_SHIELD_SHIELD_SQLI_LABEL="SQL injection shield"
PLG_SYSTEM_COLORPACK_SHIELD_SHIELD_XSS_LABEL="Cross-site scripting (XSS) shield"
PLG_SYSTEM_COLORPACK_SHIELD_SHIELD_LFI_LABEL="Local file inclusion / traversal shield"
PLG_SYSTEM_COLORPACK_SHIELD_SHIELD_RFI_LABEL="Remote file inclusion shield"

PLG_SYSTEM_COLORPACK_SHIELD_SCAN_BODY_LABEL="Scan request body"
PLG_SYSTEM_COLORPACK_SHIELD_SCAN_BODY_DESC="Inspect the raw request body (php://input) that PHP does not expose as POST fields — JSON REST payloads and raw text. Bounded to 256 KB per request; oversize bodies are partially scanned and logged."

PLG_SYSTEM_COLORPACK_SHIELD_SCAN_UPLOADS_LABEL="Scan uploaded files"
PLG_SYSTEM_COLORPACK_SHIELD_SCAN_UPLOADS_DESC="Inspect $_FILES uploads: block executable/script extensions, double extensions (img.php.jpg), files carrying server-executable content, and fake images whose bytes are not really an image."
PLG_SYSTEM_COLORPACK_SHIELD_UPLOAD_MAX_LABEL="Max upload size (bytes)"
PLG_SYSTEM_COLORPACK_SHIELD_UPLOAD_MAX_DESC="Reject any single uploaded file larger than this. 0 disables the size check. Default 10485760 (10 MB)."
PLG_SYSTEM_COLORPACK_SHIELD_UPLOAD_ALLOWLIST_LABEL="Upload extension allowlist"
PLG_SYSTEM_COLORPACK_SHIELD_UPLOAD_ALLOWLIST_DESC="Optional comma-separated list of the ONLY extensions allowed (e.g. jpg,png,pdf,docx). Leave empty to allow anything except the built-in executable denylist."

PLG_SYSTEM_COLORPACK_SHIELD_BLOCK_SILENT_LABEL="Silent block"
PLG_SYSTEM_COLORPACK_SHIELD_BLOCK_SILENT_DESC="Close the connection without a 403 body (hides that a WAF is present). The block is still logged."

PLG_SYSTEM_COLORPACK_SHIELD_FS_CLIENTIP="Visitor IP / Cloudflare"
PLG_SYSTEM_COLORPACK_SHIELD_TRUST_CLOUDFLARE_LABEL="Trust Cloudflare visitor IP"
PLG_SYSTEM_COLORPACK_SHIELD_TRUST_CLOUDFLARE_DESC="Use the CF-Connecting-IP header as the visitor IP, but only when the request really arrives from a Cloudflare address. Requests sent straight to the server cannot fake it. Leave on if the site is behind Cloudflare; harmless if it is not."
PLG_SYSTEM_COLORPACK_SHIELD_TRUSTED_PROXIES_LABEL="Own reverse proxies"
PLG_SYSTEM_COLORPACK_SHIELD_TRUSTED_PROXIES_DESC="IP addresses or ranges of reverse proxies on your own server, one per line. Leave EMPTY unless you really have one (for example the nginx in front of Apache on HestiaCP: enter 127.0.0.1 and ::1). Only add a proxy after checking that it adds the visitor to X-Forwarded-For itself; a wrongly trusted proxy lets anyone fake their IP address."
PLG_SYSTEM_COLORPACK_SHIELD_OVERRIDE_REMOTE_ADDR_LABEL="Apply visitor IP to the whole site"
PLG_SYSTEM_COLORPACK_SHIELD_OVERRIDE_REMOTE_ADDR_DESC="Also replace the server's REMOTE_ADDR so Joomla and other extensions see the real visitor IP. Off by default. Turn on only after checking the log shows the correct IP."

PLG_SYSTEM_COLORPACK_SHIELD_FS_SAFETY="Lock-out protection"
PLG_SYSTEM_COLORPACK_SHIELD_ALLOW_IPS_LABEL="Trusted IP addresses"
PLG_SYSTEM_COLORPACK_SHIELD_ALLOW_IPS_DESC="IPs or ranges (one per line, # for comments) that are never blocked. When the visitor connects directly, all checks are skipped. When the IP is learned from a header (Cloudflare or a proxy), only geo-blocking and rate limiting are skipped; the firewall and upload scan still run. Ranges wider than /8 (IPv4) or /16 (IPv6) are ignored."
PLG_SYSTEM_COLORPACK_SHIELD_AUTO_ALLOW_ADMIN_LABEL="Trust the IP of the admin who saves these settings"
PLG_SYSTEM_COLORPACK_SHIELD_AUTO_ALLOW_ADMIN_DESC="When a Super User saves this plugin, their current IP is added to the trusted list so new settings cannot lock them out. It is never added if the IP looks like Cloudflare or your own proxy."
PLG_SYSTEM_COLORPACK_SHIELD_KILLSWITCH_ACTIVE="Colorpack Shield is switched OFF by the emergency file %s. Nothing is protected. Delete that file to turn protection back on."
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_ADDED="Your IP address %s was added to the trusted list."
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_NOT_ADDED="Your IP address was not added to the trusted list because it could not be told apart from Cloudflare or your own proxy. Add it by hand under Trusted IP addresses, or fix the Cloudflare / proxy settings first."

PLG_SYSTEM_COLORPACK_SHIELD_KILLSWITCH_TOKEN_LABEL="Emergency file password (optional)"
PLG_SYSTEM_COLORPACK_SHIELD_KILLSWITCH_TOKEN_DESC="If set, the emergency file colorpack_shield.disable only switches protection off when the file contains exactly this text. Without it, any file with that name works. A password stops someone who can only upload files from silently turning protection off; keep a copy somewhere safe, because you need it when you are locked out."
PLG_SYSTEM_COLORPACK_SHIELD_ALERT_EMAIL_LABEL="Alert e-mail"
PLG_SYSTEM_COLORPACK_SHIELD_ALERT_EMAIL_DESC="Where to send a warning when the emergency file appears. Empty = the site's mail-from address."
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_KS_SUBJECT_ACTIVE="[%s] Colorpack Shield is switched OFF by the emergency file"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_KS_BODY_ACTIVE="The emergency file below exists on %1$s, so Colorpack Shield protects nothing.\n\nFile: %2$s\nFile date: %3$s\nNoticed on a request from: %4$s\n\nIf you created it, delete it as soon as you are back in. If you did NOT create it, someone may have write access to your site: change passwords, check for unknown files and users, and restore from a backup if needed.\n\nThis message is repeated once a day while the file exists."
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_KS_SUBJECT_IGNORED="[%s] Colorpack Shield: emergency file found but ignored"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_KS_BODY_IGNORED="An emergency file exists on %1$s but does NOT contain the configured password, so protection stays ON.\n\nFile: %2$s\nFile date: %3$s\nNoticed on a request from: %4$s\n\nIf you created it, put the password in it. If you did not, someone may have write access to your site: change passwords, check for unknown files and users, and restore from a backup if needed.\n\nThis message is repeated once a day while the file exists."

PLG_SYSTEM_COLORPACK_SHIELD_FS_HEADERS="Request headers"
PLG_SYSTEM_COLORPACK_SHIELD_HEADER_SCAN_LABEL="Inspect request headers"
PLG_SYSTEM_COLORPACK_SHIELD_HEADER_SCAN_DESC="Check headers such as User-Agent, Referer, X-Forwarded-For, Host and Accept*. Headers with a known format are checked against that format; free-text headers get a few targeted rules. Passwords, tokens and Cloudflare headers are never read."
PLG_SYSTEM_COLORPACK_SHIELD_HEADER_MODE_LABEL="What to do with findings"
PLG_SYSTEM_COLORPACK_SHIELD_HEADER_MODE_DESC="Recommended: block only the clear attacks (PHP object injection, Shellshock, JNDI lookups, PHP tags, malformed IP/Host/Accept headers) and just log the rest. Use 'log everything' for a first trial on a new site."
PLG_SYSTEM_COLORPACK_SHIELD_HEADER_MODE_DEFAULT="Recommended (block clear attacks, log the rest)"
PLG_SYSTEM_COLORPACK_SHIELD_HEADER_MODE_LOG="Log everything, block nothing"
PLG_SYSTEM_COLORPACK_SHIELD_HEADER_MODE_BLOCK="Block everything found"
PLG_SYSTEM_COLORPACK_SHIELD_EXTRA_HEADERS_LABEL="Extra headers to inspect"
PLG_SYSTEM_COLORPACK_SHIELD_EXTRA_HEADERS_DESC="Header names your site uses and you want checked as free text, one per line (for example X-Api-Version). Secrets such as Authorization are never inspected."
PLG_SYSTEM_COLORPACK_SHIELD_IGNORED_HEADERS_LABEL="Headers to skip"
PLG_SYSTEM_COLORPACK_SHIELD_IGNORED_HEADERS_DESC="Header names that must never be inspected, one per line. Use this if a legitimate service on your site sends an unusual header and gets blocked."

; URL path
PLG_SYSTEM_COLORPACK_SHIELD_FS_PATHS="URL path"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_SCAN_LABEL="Inspect the URL path"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_SCAN_DESC="Check the requested address (not the query string) for traversal tricks, hidden control characters, code injection, PHP files in upload folders, leftover files and scanner probes. This only sees requests that reach Joomla; files that already exist on disk are served by the web server itself and need the server-level rules (see the documentation)."
PLG_SYSTEM_COLORPACK_SHIELD_PATH_MODE_LABEL="What to do with findings"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_MODE_DESC="Recommended: block only clear attacks (path traversal, control characters, overlong UTF-8, injected code) and just log the rest. 'Log everything' is the safe way to try the feature on a new site."
PLG_SYSTEM_COLORPACK_SHIELD_PATH_MODE_RECOMMENDED="Recommended (block clear attacks, log the rest)"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_MODE_LOG="Log everything, block nothing"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_MODE_BLOCK="Block everything found"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_LABEL="Scanner probes"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_DESC="Requests for things a Joomla site does not have: /.env, /.git/config, old-CVE and other-CMS paths (/wp-login.php, /xmlrpc.php, WordPress plugin paths), shell and backup names. These never come from a mistake - only from attack tooling. Start with 'Log only' to see how much scanning your site gets; 'Block and ban the address' also shuts out every later request from that address for a while."
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_OFF="Off"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_LOG="Log only"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_BLOCK="Block"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_BAN="Block and ban the address"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_BAN_HOURS_LABEL="Ban duration (hours)"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_BAN_HOURS_DESC="How long a banned address is refused outright once it is caught requesting one of these paths - every request from it is rejected immediately, not just the one that matched, until the ban lifts."
PLG_SYSTEM_COLORPACK_SHIELD_PATH_TOOLS_LABEL="Admin tools to leave alone"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_TOOLS_DESC="Names of tools that legitimately live under your domain (one per line), such as phpmyadmin or webmail. Requests for these are never reported as probes."
PLG_SYSTEM_COLORPACK_SHIELD_PATH_ALLOW_LABEL="Paths that are never reported"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_ALLOW_DESC="One per line. A line starting with / is a prefix (for example /components/com_pay/notify.php); a line starting with re: is a regular expression. Applies to the location rules only; traversal and injection checks always run."
PLG_SYSTEM_COLORPACK_SHIELD_PATH_DENY_LABEL="Extra paths to block"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_DENY_DESC="One per line, same syntax as above (/prefix or re:expression). A matching request is blocked unless the mode is 'Log everything'."

; Administrator protection
PLG_SYSTEM_COLORPACK_SHIELD_FS_ADMINPROTECT="Administrator protection"
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_LOCKOUT_LABEL="Lock out repeated failed logins"
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_LOCKOUT_DESC="After too many wrong passwords for the administrator login, lock that visitor's IP address for a while. The lock grows when it repeats. A user name is never locked on its own, so nobody can keep you out by guessing your name. Addresses that stand for many visitors (your own proxy, Cloudflare) and sites whose real-IP check has not passed are never blocked, only logged."
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_MAX_FAILURES_LABEL="Failed logins before a lock"
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_MAX_FAILURES_DESC="How many wrong attempts from one address are allowed inside the time window below."
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_FAILURE_WINDOW_LABEL="Counting window (seconds)"
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_FAILURE_WINDOW_DESC="Failed attempts older than this are forgotten. Default 600 (10 minutes)."
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_LOCK_MINUTES_LABEL="First lock (minutes)"
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_LOCK_MINUTES_DESC="How long the first lock lasts. Every repeat doubles it."
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_LOCK_MAX_HOURS_LABEL="Longest lock (hours)"
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_LOCK_MAX_HOURS_DESC="The lock never grows beyond this. Default 24."
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_RATE_LABEL="Login attempts per minute per address"
PLG_SYSTEM_COLORPACK_SHIELD_LOGIN_RATE_DESC="A separate, stricter speed limit for the administrator login form. 0 = off."
PLG_SYSTEM_COLORPACK_SHIELD_ALERT_NEW_ADMIN_LABEL="Alert: new or promoted Super User"
PLG_SYSTEM_COLORPACK_SHIELD_ALERT_NEW_ADMIN_DESC="Send an e-mail at once when a Super User is created or a user is added to the Super Users group. After a break-in this is often the first thing an attacker does."
PLG_SYSTEM_COLORPACK_SHIELD_ALERT_NEW_IP_LABEL="Alert: login from a new address"
PLG_SYSTEM_COLORPACK_SHIELD_ALERT_NEW_IP_DESC="Send an e-mail when an administrator logs in from an address not seen before. The first login after installing is only remembered. Only a salted fingerprint of each address is stored."
PLG_SYSTEM_COLORPACK_SHIELD_ALERT_LOCKOUTS_LABEL="Alert: an address was locked"
PLG_SYSTEM_COLORPACK_SHIELD_ALERT_LOCKOUTS_DESC="Send one summary e-mail (at most once an hour) when failed logins lock an address."
PLG_SYSTEM_COLORPACK_SHIELD_MFA_ENFORCE_LABEL="Require multi-factor authentication"
PLG_SYSTEM_COLORPACK_SHIELD_MFA_ENFORCE_DESC="Joomla offers multi-factor authentication but does not require it. 'Warn' reminds users who have none; 'Require' sends them to the setup page after the grace period and keeps them there until they finish. Needs Joomla 4.2 or later."
PLG_SYSTEM_COLORPACK_SHIELD_MFA_ENFORCE_OFF="Off"
PLG_SYSTEM_COLORPACK_SHIELD_MFA_ENFORCE_WARN="Warn only"
PLG_SYSTEM_COLORPACK_SHIELD_MFA_ENFORCE_ENFORCE="Require after the grace period"
PLG_SYSTEM_COLORPACK_SHIELD_MFA_GROUPS_LABEL="User groups that need it"
PLG_SYSTEM_COLORPACK_SHIELD_MFA_GROUPS_DESC="Default: Super Users."
PLG_SYSTEM_COLORPACK_SHIELD_MFA_GRACE_LABEL="Grace period (days)"
PLG_SYSTEM_COLORPACK_SHIELD_MFA_GRACE_DESC="How long a user without multi-factor authentication may keep logging in before it is required. Counted from the first time we see them without it."

; Administrator alerts
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWADMIN_SUBJECT="[%s] Colorpack Shield: a Super User was created or promoted"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWADMIN_BODY_CREATED="A new Super User account was created on %1$s.\n\nUser name: %2$s\nUser ID: %3$s\nGroups: %4$s\nDone by: %5$s\nFrom address: %6$s\nTime: %7$s\n\nIf you did not expect this, someone may have access to your site: remove the account if it is not yours, change passwords, check for other unknown users and files, and restore from a backup if needed."
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWADMIN_BODY_PROMOTED="An existing user was given Super User powers on %1$s.\n\nUser name: %2$s\nUser ID: %3$s\nGroups: %4$s\nDone by: %5$s\nFrom address: %6$s\nTime: %7$s\n\nIf you did not expect this, someone may have access to your site: take the powers back, change passwords, check for other unknown users and files, and restore from a backup if needed."
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWIP_SUBJECT="[%s] Colorpack Shield: administrator login from a new address"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWIP_BODY="The user %2$s logged in to the administrator of %1$s from an address not seen before: %3$s\nTime: %4$s\n\nIf this was you (a new network, a trip, a new device) nothing needs to be done. If not, change the password, turn on multi-factor authentication and check the site for unknown users and files."
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_LOCKOUT_SUBJECT="[%s] Colorpack Shield: an address was locked out of the administrator"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_LOCKOUT_BODY="Too many wrong passwords were entered for the administrator login of %1$s.\n\nAddress: %2$s\nLocked for: %3$s seconds\nRepeat offences: %4$s\nStatus: %5$s\nSummaries held back since the last mail: %6$s\nTime: %7$s\n\nThe lock is automatic and lifts by itself. If it is you, wait, or ask whoever runs the server to use the unlock tool (cli/admin_unlock.php)."
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_LOCKOUT_ENFORCED="the lock is enforced"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_LOCKOUT_OBSERVED="observed only (the address looks shared, so nobody is blocked)"

; Multi-factor authentication reminders
PLG_SYSTEM_COLORPACK_SHIELD_MFA_MSG_GRACE="Your account has no multi-factor authentication. Please set it up within %1$s day(s): <a href='%2$s'>open Multi-factor Authentication</a>."
PLG_SYSTEM_COLORPACK_SHIELD_MFA_MSG_OVERDUE="Multi-factor authentication is required for your account and the time to set it up has run out. Please set it up now: <a href='%1$s'>open Multi-factor Authentication</a>."
PLG_SYSTEM_COLORPACK_SHIELD_MFA_MSG_REQUIRED="Multi-factor authentication is required for your account. Please set it up to continue."

; Administrator access key and address list
PLG_SYSTEM_COLORPACK_SHIELD_GATE_ENABLED_LABEL="Administrator access key"
PLG_SYSTEM_COLORPACK_SHIELD_GATE_ENABLED_DESC="When on, the administrator looks like a missing page (404) to anyone without the key. Visit /administrator/?cpskey=YOUR_KEY once on each browser to get in; the key is then removed from the address. A trusted IP address does not need it. The way back, with FTP or a file manager only: create an empty file named gate.off in the folder cache/colorpack_shield (opens just this), or colorpack_shield.disable in the site folder (switches the whole plugin off)."
PLG_SYSTEM_COLORPACK_SHIELD_GATE_KEY_LABEL="Access key"
PLG_SYSTEM_COLORPACK_SHIELD_GATE_KEY_DESC="At least 10 letters, digits, - or _. Leave it empty and a strong 12-character key is made for you when you save. Changing it signs every browser out of the gate. The key appears in the web server's own access log on the first visit; this is an extra layer against scanners, not a replacement for two-step login."
PLG_SYSTEM_COLORPACK_SHIELD_GATE_COOKIE_HOURS_LABEL="Hours the gate stays open per browser"
PLG_SYSTEM_COLORPACK_SHIELD_GATE_COOKIE_HOURS_DESC="1 to 168. After this time the key is needed again."
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_ENFORCE_LABEL="Only listed addresses may reach the administrator"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_ENFORCE_DESC="Everyone else gets a plain 404 (or the access key, if that is on, opens the door too). Risky with changing addresses: your current address must be in the list. If the real visitor address cannot be told (a CDN or proxy that is not set up), the list is only observed and never blocks."
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_LIST_LABEL="Addresses allowed to reach the administrator"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_LIST_DESC="One address or range per line (ranges wider than /8 for IPv4 or /16 for IPv6 are refused). Lines starting with # are comments."
