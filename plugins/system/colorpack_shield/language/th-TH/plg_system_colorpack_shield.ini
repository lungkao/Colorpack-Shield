; Administrator alerts
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWADMIN_SUBJECT="[%s] Colorpack Shield: มีผู้ดูแลระดับสูงสุดคนใหม่หรือถูกเลื่อนสิทธิ์"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWADMIN_BODY_CREATED="มีการสร้างบัญชีผู้ดูแลระดับสูงสุด (Super User) คนใหม่บนเว็บ %1$s\n\nชื่อผู้ใช้: %2$s\nรหัสผู้ใช้: %3$s\nกลุ่ม: %4$s\nผู้ที่ทำรายการนี้: %5$s\nจาก IP: %6$s\nเวลา: %7$s\n\nถ้าคุณเป็นคนทำเอง ไม่ต้องทำอะไรเพิ่ม แต่ถ้าไม่ได้คาดไว้ อาจมีคนแปลกหน้าเข้าถึงเว็บของคุณได้แล้ว ให้ลบบัญชีนี้ทิ้งถ้าไม่ใช่ของคุณ เปลี่ยนรหัสผ่านทั้งหมด ตรวจหาผู้ใช้และไฟล์ที่ไม่รู้จัก และกู้คืนจากข้อมูลสำรองถ้าจำเป็น"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWADMIN_BODY_PROMOTED="ผู้ใช้ที่มีอยู่แล้วถูกเลื่อนขึ้นเป็นผู้ดูแลระดับสูงสุดบนเว็บ %1$s\n\nชื่อผู้ใช้: %2$s\nรหัสผู้ใช้: %3$s\nกลุ่ม: %4$s\nผู้ที่ทำรายการนี้: %5$s\nจาก IP: %6$s\nเวลา: %7$s\n\nถ้าคุณเป็นคนทำเอง ไม่ต้องทำอะไรเพิ่ม แต่ถ้าไม่ได้คาดไว้ อาจมีคนแปลกหน้าเข้าถึงเว็บของคุณได้แล้ว ให้ถอนสิทธิ์นี้คืน เปลี่ยนรหัสผ่านทั้งหมด ตรวจหาผู้ใช้และไฟล์ที่ไม่รู้จัก และกู้คืนจากข้อมูลสำรองถ้าจำเป็น"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWIP_SUBJECT="[%s] Colorpack Shield: มีการล็อกอินหลังบ้านจาก IP ใหม่"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWIP_BODY="ผู้ใช้ %2$s ล็อกอินเข้าหลังบ้านของเว็บ %1$s จาก IP ที่ไม่เคยเห็นมาก่อน: %3$s\nเวลา: %4$s\n\nถ้าเป็นคุณเอง (เปลี่ยนเครือข่าย เดินทาง หรือใช้อุปกรณ์ใหม่) ไม่ต้องทำอะไรเพิ่ม แต่ถ้าไม่ใช่คุณ ให้เปลี่ยนรหัสผ่านทันที เปิดใช้การยืนยันตัวตนหลายปัจจัย และตรวจหาผู้ใช้กับไฟล์ที่ไม่รู้จักเพิ่มเติม"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_LOCKOUT_SUBJECT="[%s] Colorpack Shield: มี IP ถูกล็อกออกจากหน้าหลังบ้าน"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_LOCKOUT_BODY="มีการใส่รหัสผ่านผิดหลายครั้งที่ฟอร์มล็อกอินหลังบ้านของเว็บ %1$s\n\nIP: %2$s\nระยะเวลาที่ถูกล็อก: %3$s วินาที\nทำผิดซ้ำมาแล้ว: %4$s ครั้ง\nสถานะ: %5$s\nจำนวนครั้งที่ถูกกันไว้ตั้งแต่อีเมลฉบับก่อน: %6$s\nเวลา: %7$s\n\nการล็อกนี้เกิดขึ้นเองอัตโนมัติ และจะหมดไปเองเมื่อครบเวลา ถ้าเป็นคุณเอง ให้รอจนครบเวลา หรือให้ผู้ดูแลเซิร์ฟเวอร์ใช้เครื่องมือปลดล็อก (cli/admin_unlock.php) ช่วยปลดให้"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_LOCKOUT_ENFORCED="บล็อกจริง"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_LOCKOUT_OBSERVED="สังเกตไว้เฉย ๆ (IP นี้ดูเหมือนมีคนใช้ร่วมกันหลายคน จึงยังไม่ได้บล็อกใครจริง)"

