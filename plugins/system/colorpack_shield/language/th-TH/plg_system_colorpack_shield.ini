PLG_SYSTEM_COLORPACK_SHIELD_MAIL_KS_SUBJECT_ACTIVE="[%s] Colorpack Shield ถูกปิดอยู่ด้วยไฟล์ฉุกเฉิน"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_KS_BODY_ACTIVE="พบไฟล์ฉุกเฉินด้านล่างอยู่บนเว็บ %1$s ทำให้ Colorpack Shield ไม่ได้ป้องกันอะไรเลยในขณะนี้\n\nไฟล์: %2$s\nวันที่ของไฟล์: %3$s\nพบจากคำขอของ IP: %4$s\n\nถ้าคุณเป็นคนสร้างไฟล์นี้เอง ให้ลบทิ้งทันทีที่กลับเข้าเว็บได้ ถ้าคุณไม่ได้สร้าง อาจมีคนแปลกหน้าเขียนไฟล์ลงในเว็บของคุณได้ ให้เปลี่ยนรหัสผ่านทั้งหมด ตรวจหาไฟล์และผู้ใช้ที่ไม่รู้จัก และกู้คืนจากข้อมูลสำรองถ้าจำเป็น\n\nอีเมลฉบับนี้จะถูกส่งซ้ำวันละครั้ง ตราบใดที่ไฟล์นี้ยังอยู่"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_KS_SUBJECT_IGNORED="[%s] Colorpack Shield: พบไฟล์ฉุกเฉินแต่ยังไม่มีผล"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_KS_BODY_IGNORED="พบไฟล์ฉุกเฉินอยู่บนเว็บ %1$s แต่เนื่องจากไม่ได้ตั้งรหัสลับไว้ล่วงหน้า การป้องกันจึงยังเปิดทำงานอยู่ตามปกติ\n\nไฟล์: %2$s\nวันที่ของไฟล์: %3$s\nพบจากคำขอของ IP: %4$s\n\nถ้าคุณเป็นคนสร้างไฟล์นี้เอง ให้เพิ่มรหัสลับลงในไฟล์ ถ้าคุณไม่ได้สร้าง อาจมีคนแปลกหน้าเขียนไฟล์ลงในเว็บของคุณได้ ให้เปลี่ยนรหัสผ่านทั้งหมด ตรวจหาไฟล์และผู้ใช้ที่ไม่รู้จัก และกู้คืนจากข้อมูลสำรองถ้าจำเป็น\n\nอีเมลฉบับนี้จะถูกส่งซ้ำวันละครั้ง ตราบใดที่ไฟล์นี้ยังอยู่"
