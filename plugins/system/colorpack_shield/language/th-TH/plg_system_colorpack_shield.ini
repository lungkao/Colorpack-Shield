PLG_SYSTEM_COLORPACK_SHIELD_MFA_MSG_REQUIRED="บัญชีของคุณต้องตั้งการยืนยันตัวตนหลายปัจจัย (MFA) ก่อน กรุณาตั้งค่าเพื่อใช้งานต่อ"

; Administrator access key and address list
PLG_SYSTEM_COLORPACK_SHIELD_GATE_ENABLED_LABEL="กุญแจเข้าหลังบ้าน"
PLG_SYSTEM_COLORPACK_SHIELD_GATE_ENABLED_DESC="เมื่อเปิดใช้ หน้าหลังบ้านจะดูเหมือนไม่มีอยู่เลย (ขึ้นหน้า 404) สำหรับคนที่ไม่มีกุญแจ ให้เปิดลิงก์ /administrator/?cpskey=กุญแจของคุณ หนึ่งครั้งในแต่ละเบราว์เซอร์ที่ใช้เพื่อเข้า หลังจากนั้นกุญแจจะหายไปจากแถบที่อยู่ ส่วน IP ที่เชื่อถือได้ไม่ต้องใช้กุญแจก็เข้าได้ อย่าลืมจำไฟล์ปิดฉุกเฉินไว้เป็นทางกลับ เผื่อตัวเองเข้าไม่ได้"
PLG_SYSTEM_COLORPACK_SHIELD_GATE_KEY_LABEL="กุญแจเข้า"
PLG_SYSTEM_COLORPACK_SHIELD_GATE_KEY_DESC="ต้องยาวอย่างน้อย 10 ตัวอักษร ใช้ได้แค่ตัวอักษร ตัวเลข เครื่องหมาย - หรือ _ ถ้าปล่อยว่างไว้ ระบบจะสร้างกุญแจ 12 ตัวที่แข็งแรงให้เองตอนบันทึก เมื่อเปลี่ยนกุญแจ ทุกเบราว์เซอร์ต้องเข้าใหม่ด้วยกุญแจใหม่ กุญแจนี้จะปรากฏอยู่ในไฟล์บันทึกการเข้าของเว็บเซิร์ฟเวอร์ตอนที่เข้าครั้งแรก ฟีเจอร์นี้เป็นชั้นป้องกันเสริมจากบอตและเครื่องมือสแกน ไม่ใช่ตัวแทนของการยืนยันตัวตนสองขั้นตอน"
PLG_SYSTEM_COLORPACK_SHIELD_GATE_COOKIE_HOURS_LABEL="จำนวนชั่วโมงที่ให้เข้าได้ต่อเบราว์เซอร์ (ไม่ต้องใส่กุญแจซ้ำ)"
PLG_SYSTEM_COLORPACK_SHIELD_GATE_COOKIE_HOURS_DESC="ตั้งได้ตั้งแต่ 1 ถึง 168 ชั่วโมง หลังครบเวลานี้ต้องใส่กุญแจเข้าอีกครั้ง"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_ENFORCE_LABEL="อนุญาตเฉพาะ IP ในรายการเท่านั้นให้เข้าหลังบ้านได้"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_ENFORCE_DESC="คนอื่นที่ไม่อยู่ในรายการจะเจอหน้า 404 เปล่า ๆ (หรือเข้าได้ด้วยกุญแจเข้าหลังบ้านถ้าเปิดไว้ด้วย) มีความเสี่ยงถ้า IP ของคุณเปลี่ยนบ่อย เพราะ IP ปัจจุบันของคุณต้องอยู่ในรายการนี้ก่อนเสมอ ถ้าระบบแยกไม่ออกว่า IP จริงของผู้เข้าชมคือใคร (เช่น อยู่หลัง CDN หรือตัวกลางที่ยังไม่ได้ตั้งค่า) รายการนี้จะถูกใช้แค่เฝ้าดูเท่านั้น ยังไม่บล็อกใครจริง"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_LIST_LABEL="IP ที่เข้าหลังบ้านได้"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_LIST_DESC="บรรทัดละหนึ่ง IP หรือช่วง IP (ช่วงที่กว้างกว่า /8 สำหรับ IPv4 หรือ /16 สำหรับ IPv6 จะถูกปฏิเสธเพราะกว้างเกินไป) บรรทัดที่ขึ้นต้นด้วย # ใช้เป็นหมายเหตุได้"
