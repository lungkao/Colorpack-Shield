PLG_SYSTEM_COLORPACK_SHIELD="System - Colorpack Shield WAF"
PLG_SYSTEM_COLORPACK_SHIELD_XML_DESCRIPTION="Colorpack Shield คือตัวป้องกันที่ตรวจคำขอทุกอย่างที่เข้ามาที่เว็บ คอยจับคำสั่งโจมตีฐานข้อมูล (SQLi) สคริปต์แปลกปลอม (XSS) และไฟล์อันตราย (LFI/RFI) ครอบคลุมทั้งหน้าเว็บ หลังบ้าน (administrator) และ API ตรวจส่วนหัวของคำขอ ลิงก์ที่เรียกเข้ามา ไฟล์อัปโหลด และรู้ IP จริงของผู้เข้าชมแม้เว็บอยู่หลัง Cloudflare"
PLG_SYSTEM_COLORPACK_SHIELD_FS_COVERAGE="จุดของเว็บที่ป้องกัน"
PLG_SYSTEM_COLORPACK_SHIELD_FS_SHIELDS="ตัวตรวจจับการโจมตี"
PLG_SYSTEM_COLORPACK_SHIELD_FS_GEOIP="กรองตามประเทศ (GeoIP)"
PLG_SYSTEM_COLORPACK_SHIELD_FS_RATELIMIT="จำกัดคำขอที่ถี่เกินไป"
PLG_SYSTEM_COLORPACK_SHIELD_FS_ADVANCED="ขั้นสูง"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_ENABLED_LABEL="เปิดกรองตามประเทศ (GeoIP)"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_ENABLED_DESC="บล็อกหรืออนุญาตคำขอตามประเทศต้นทาง โดยใช้ฐานข้อมูล MaxMind GeoLite2 ที่เก็บไว้ในเครื่องเอง (ไม่ต้องต่อเน็ตทุกครั้งที่ตรวจ) ต้องมี PHP extension ชื่อ maxminddb หรือแพ็กเกจ Composer geoip2/geoip2 ถ้าเซิร์ฟเวอร์ไม่มีทั้งสองอย่าง ระบบจะข้ามการตรวจนี้ไปเงียบ ๆ (ปล่อยผ่านทุกคำขอ)"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_DB_LABEL="ตำแหน่งไฟล์ฐานข้อมูล GeoLite2"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_DB_DESC="พาธ (path) เต็มของไฟล์ GeoLite2-Country.mmdb ที่เก็บไว้ในเครื่อง ซึ่งคุณต้องอัปเดตเองด้วย cron การตรวจทำในเครื่องทั้งหมด ไม่มีการต่อเน็ตออกไปในแต่ละคำขอ"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_MODE_LABEL="โหมด"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_MODE_DESC="โหมดปฏิเสธ จะบล็อกเฉพาะประเทศที่ระบุไว้ ส่วนโหมดอนุญาต จะบล็อกทุกประเทศ ยกเว้นประเทศที่ระบุไว้"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_MODE_DENY="ปฏิเสธเฉพาะประเทศที่ระบุ"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_MODE_ALLOW="อนุญาตเฉพาะประเทศที่ระบุ"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_COUNTRIES_LABEL="ประเทศ"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_COUNTRIES_DESC="รหัสประเทศแบบ ISO 3166-1 สองตัวอักษร คั่นด้วยจุลภาค เช่น TH,SG,US"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_UNKNOWN_LABEL="อนุญาตเมื่อระบุประเทศไม่ได้"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_UNKNOWN_DESC="ในโหมดอนุญาต ให้ปล่อยผ่านคำขอที่ระบุประเทศไม่ได้ (เช่น IP วงในเครือข่าย หรือไม่มีในฐานข้อมูล) ปิดตัวเลือกนี้เพื่อบล็อกคำขอแบบนี้ไว้ก่อนเพื่อความปลอดภัย"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_ALLOW_IPS_LABEL="IP ที่อนุญาตเสมอ (CIDR)"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_ALLOW_IPS_DESC="ใส่ IP หรือช่วง IP แบบ CIDR บรรทัดละหนึ่งรายการ ที่จะผ่านได้เสมอโดยไม่สนประเทศต้นทาง (เช่น IP ของออฟฟิศคุณเอง หรือเครื่องมือตรวจสถานะเว็บ) รายการนี้มีสิทธิ์สูงสุด ชนะกฎทุกข้อ"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_DENY_IPS_LABEL="IP ที่บล็อกเสมอ (CIDR)"
PLG_SYSTEM_COLORPACK_SHIELD_GEO_DENY_IPS_DESC="ใส่ IP หรือช่วง IP แบบ CIDR บรรทัดละหนึ่งรายการ ที่จะถูกบล็อกเสมอ ระบบตรวจรายการนี้ก่อนกฎเรื่องประเทศ"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_ENABLED_LABEL="เปิดจำกัดคำขอที่ถี่เกินไป"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_ENABLED_DESC="ชะลอคำขอจาก IP เดียวกันที่ถี่เกินไป โดยนับจำนวนครั้งในช่วงเวลาที่กำหนด ต้องมี PHP extension ชื่อ APCu ถ้าเซิร์ฟเวอร์ไม่มี ระบบจะข้ามการตรวจนี้ไปเงียบ ๆ (ปล่อยผ่านทุกคำขอ)"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_WINDOW_LABEL="ช่วงเวลานับ (วินาที)"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_WINDOW_DESC="ความยาวของช่วงเวลาที่ใช้นับจำนวนคำขอ หน่วยเป็นวินาที"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_LIMIT_LABEL="จำนวนคำขอสูงสุดต่อช่วงเวลา"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_LIMIT_DESC="จำนวนคำขอมากที่สุดที่ IP หนึ่งทำได้ในหนึ่งช่วงเวลา ถ้าเกินจะได้รับสัญลักษณ์ข้อผิดพลาด HTTP 429 (ขอถี่เกินไป) นับแยกตามจุดของเว็บและคอมโพเนนต์"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_THRESHOLD_LABEL="แบนชั่วคราวเมื่อทำผิดกี่ครั้ง"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_THRESHOLD_DESC="จำนวนครั้งที่ได้รับ 429 ภายในช่วงนับการแบน ก่อนที่ IP นั้นจะถูกแบนชั่วคราว ตั้งเป็น 0 เพื่อไม่ใช้การแบนชั่วคราว"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_WINDOW_LABEL="ช่วงนับการแบน (วินาที)"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_WINDOW_DESC="ช่วงเวลาที่ใช้นับจำนวนครั้งที่ทำผิด เพื่อเทียบกับเกณฑ์การแบน"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_DURATION_LABEL="ระยะเวลาแบน (วินาที)"
PLG_SYSTEM_COLORPACK_SHIELD_RATE_BAN_DURATION_DESC="IP ที่ถูกแบนชั่วคราวจะถูกบล็อกทั้งหมดนานเท่าไร"
PLG_SYSTEM_COLORPACK_SHIELD_COVER_SITE_LABEL="ป้องกันหน้าเว็บ (site)"
PLG_SYSTEM_COLORPACK_SHIELD_COVER_SITE_DESC="ตรวจคำขอทุกอย่างที่เข้าหน้าเว็บส่วนที่คนทั่วไปเห็น"
PLG_SYSTEM_COLORPACK_SHIELD_COVER_ADMIN_LABEL="ป้องกันหลังบ้าน (administrator)"
PLG_SYSTEM_COLORPACK_SHIELD_COVER_ADMIN_DESC="ตรวจคำขอที่เข้าหลังบ้านด้วย ปิดช่องโหว่ที่ตัวป้องกันอื่นส่วนใหญ่มักป้องกันแค่หน้าเว็บอย่างเดียว"
PLG_SYSTEM_COLORPACK_SHIELD_COVER_API_LABEL="ป้องกัน API"
PLG_SYSTEM_COLORPACK_SHIELD_COVER_API_DESC="ตรวจคำขอที่เข้า Joomla web services (api) ด้วย"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_ALLOWLIST_LABEL="คอมโพเนนต์หลังบ้านที่ยกเว้นการตรวจ"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_ALLOWLIST_DESC="ชื่อคอมโพเนนต์ (บรรทัดละหนึ่งรายการ เช่น com_colorpack_shield) ที่ไม่ต้องตรวจตอนใช้งานหลังบ้าน เพื่อไม่ให้ผู้ดูแลระดับสูงสุดถูกบล็อกเองจากคอมโพเนนต์ที่เชื่อถือได้อยู่แล้ว ซึ่งค่าตั้งของคอมโพเนนต์เหล่านั้นมักมีข้อความหน้าตาคล้ายคำสั่งค้นหา (regex) อยู่เป็นปกติ"
PLG_SYSTEM_COLORPACK_SHIELD_SHIELD_SQLI_LABEL="ตัวตรวจคำสั่งโจมตีฐานข้อมูล (SQL injection)"
PLG_SYSTEM_COLORPACK_SHIELD_SHIELD_XSS_LABEL="ตัวตรวจสคริปต์แทรกอันตราย (Cross-site scripting / XSS)"
PLG_SYSTEM_COLORPACK_SHIELD_SHIELD_LFI_LABEL="ตัวตรวจการแอบเปิดไฟล์ในเซิร์ฟเวอร์ (local file inclusion / traversal)"
PLG_SYSTEM_COLORPACK_SHIELD_SHIELD_RFI_LABEL="ตัวตรวจการแอบโหลดไฟล์จากเว็บอื่น (remote file inclusion)"
PLG_SYSTEM_COLORPACK_SHIELD_SCAN_BODY_LABEL="ตรวจเนื้อหาที่ส่งมากับคำขอ (body)"
PLG_SYSTEM_COLORPACK_SHIELD_SCAN_BODY_DESC="ตรวจข้อมูลดิบที่ส่งมากับคำขอ (php://input) ซึ่ง PHP ไม่ได้แปลงเป็นฟิลด์ POST ให้ เช่น ข้อมูล JSON ของ REST API และข้อความดิบอื่น ๆ จำกัดไว้ที่ 256 KB ต่อคำขอ ถ้าใหญ่กว่านั้นจะตรวจแค่บางส่วนและบันทึกไว้ในไฟล์บันทึก"
PLG_SYSTEM_COLORPACK_SHIELD_SCAN_UPLOADS_LABEL="ตรวจไฟล์ที่อัปโหลด"
PLG_SYSTEM_COLORPACK_SHIELD_SCAN_UPLOADS_DESC="ตรวจไฟล์ทุกไฟล์ที่มีคนอัปโหลดเข้ามา: บล็อกไฟล์ที่รันเป็นโค้ดได้หรือเป็นสคริปต์ ไฟล์ที่ตั้งนามสกุลซ้อนกัน (เช่น img.php.jpg) ไฟล์ที่มีโค้ดซึ่งเซิร์ฟเวอร์รันได้แฝงอยู่ และไฟล์ที่ปลอมเป็นรูปภาพทั้งที่ข้อมูลข้างในไม่ใช่รูปจริง"
PLG_SYSTEM_COLORPACK_SHIELD_UPLOAD_MAX_LABEL="ขนาดไฟล์อัปโหลดสูงสุด (ไบต์)"
PLG_SYSTEM_COLORPACK_SHIELD_UPLOAD_MAX_DESC="ปฏิเสธไฟล์อัปโหลดแต่ละไฟล์ที่ใหญ่กว่าค่านี้ ตั้งเป็น 0 เพื่อไม่จำกัดขนาด ค่าเริ่มต้นคือ 10485760 ไบต์ (10 MB)"
PLG_SYSTEM_COLORPACK_SHIELD_UPLOAD_ALLOWLIST_LABEL="นามสกุลไฟล์ที่อนุญาตให้อัปโหลด"
PLG_SYSTEM_COLORPACK_SHIELD_UPLOAD_ALLOWLIST_DESC="ใส่รายการนามสกุลไฟล์ที่อนุญาตเท่านั้น คั่นด้วยจุลภาค (เช่น jpg,png,pdf,docx) ถ้าเว้นว่างไว้ จะอนุญาตทุกนามสกุล ยกเว้นนามสกุลที่รันเป็นโค้ดได้ซึ่งระบบบล็อกไว้เป็นค่าเริ่มต้นอยู่แล้ว"
PLG_SYSTEM_COLORPACK_SHIELD_BLOCK_SILENT_LABEL="บล็อกแบบเงียบ"
PLG_SYSTEM_COLORPACK_SHIELD_BLOCK_SILENT_DESC="ตัดการเชื่อมต่อทันทีโดยไม่ส่งหน้าแจ้งเตือน 403 กลับไป (ทำให้ผู้โจมตีไม่รู้ว่าเว็บนี้มีตัวป้องกันอยู่) เหตุการณ์ที่ถูกบล็อกยังถูกบันทึกไว้ในไฟล์บันทึกตามปกติ"
PLG_SYSTEM_COLORPACK_SHIELD_FS_CLIENTIP="IP ผู้เข้าชม / Cloudflare"
PLG_SYSTEM_COLORPACK_SHIELD_TRUST_CLOUDFLARE_LABEL="เชื่อ IP ผู้เข้าชมที่ได้จาก Cloudflare"
PLG_SYSTEM_COLORPACK_SHIELD_TRUST_CLOUDFLARE_DESC="ใช้ส่วนหัว CF-Connecting-IP เป็น IP จริงของผู้เข้าชม แต่จะใช้ก็ต่อเมื่อคำขอนั้นมาจาก IP ของ Cloudflare จริง ๆ เท่านั้น คำขอที่ส่งตรงเข้าเซิร์ฟเวอร์จะปลอมค่านี้ไม่ได้ เปิดไว้ถ้าเว็บของคุณอยู่หลัง Cloudflare ถ้าไม่ได้ใช้ Cloudflare เปิดไว้ก็ไม่มีผลเสียอะไร"
PLG_SYSTEM_COLORPACK_SHIELD_TRUSTED_PROXIES_LABEL="ตัวกลาง (reverse proxy) ของเครื่องคุณเอง"
PLG_SYSTEM_COLORPACK_SHIELD_TRUSTED_PROXIES_DESC="ใส่ IP หรือช่วง IP ของตัวกลางที่อยู่บนเครื่องเดียวกันกับเว็บ บรรทัดละหนึ่งรายการ ปล่อยว่างไว้ถ้าไม่มีจริง ๆ (เช่น ถ้าใช้ nginx อยู่หน้า Apache บน HestiaCP ให้ใส่ 127.0.0.1 และ ::1) เพิ่มตัวกลางเข้าไปเฉพาะเมื่อตรวจแล้วว่ามันส่ง IP ผู้เข้าชมจริงมาทาง X-Forwarded-For ให้ถูกต้อง ถ้าเชื่อตัวกลางผิดตัว จะทำให้ใครก็ปลอม IP ของตัวเองได้"
PLG_SYSTEM_COLORPACK_SHIELD_OVERRIDE_REMOTE_ADDR_LABEL="ใช้ IP ผู้เข้าชมนี้กับทั้งเว็บ"
PLG_SYSTEM_COLORPACK_SHIELD_OVERRIDE_REMOTE_ADDR_DESC="แทนที่ค่า REMOTE_ADDR ของเซิร์ฟเวอร์ด้วย IP ที่ตรวจพบจริง เพื่อให้ Joomla และส่วนขยายอื่นเห็น IP จริงของผู้เข้าชมด้วย ปิดไว้เป็นค่าเริ่มต้น ควรเปิดก็ต่อเมื่อตรวจไฟล์บันทึกแล้วเห็นว่าระบบอ่าน IP ได้ถูกต้องดีแล้ว"
PLG_SYSTEM_COLORPACK_SHIELD_FS_SAFETY="กันตัวเองถูกล็อกออก"
PLG_SYSTEM_COLORPACK_SHIELD_ALLOW_IPS_LABEL="IP ที่เชื่อถือได้"
PLG_SYSTEM_COLORPACK_SHIELD_ALLOW_IPS_DESC="ใส่ IP หรือช่วง IP (บรรทัดละหนึ่งรายการ ใช้ # นำหน้าถ้าจะเขียนหมายเหตุ) ที่จะไม่ถูกบล็อกเลย ถ้าผู้เข้าชมต่อเข้ามาโดยตรง จะข้ามการตรวจทั้งหมด ถ้า IP มาจากส่วนหัว (ผ่าน Cloudflare หรือตัวกลาง) จะข้ามเฉพาะการกรองตามประเทศและการจำกัดคำขอถี่เท่านั้น ส่วนการตรวจการโจมตีและไฟล์อัปโหลดยังทำงานตามปกติ ช่วงที่กว้างกว่า /8 (สำหรับ IPv4) หรือ /16 (สำหรับ IPv6) จะถูกเพิกเฉยเพราะกว้างเกินไป"
PLG_SYSTEM_COLORPACK_SHIELD_AUTO_ALLOW_ADMIN_LABEL="เชื่อ IP ของผู้ดูแลที่บันทึกค่าตั้งนี้โดยอัตโนมัติ"
PLG_SYSTEM_COLORPACK_SHIELD_AUTO_ALLOW_ADMIN_DESC="เมื่อผู้ดูแลระดับสูงสุดกดบันทึกหน้าตั้งค่านี้ IP ที่ใช้อยู่ตอนนั้นจะถูกเพิ่มเข้ารายการที่เชื่อถือให้อัตโนมัติ เพื่อไม่ให้การตั้งค่าครั้งนี้ทำให้ตัวเองเข้าเว็บไม่ได้ ระบบจะไม่เพิ่มให้ถ้า IP นั้นดูเหมือนเป็นของ Cloudflare หรือตัวกลางของคุณเอง"
PLG_SYSTEM_COLORPACK_SHIELD_KILLSWITCH_ACTIVE="Colorpack Shield ถูกปิดอยู่ด้วยไฟล์ฉุกเฉิน %s ตอนนี้เว็บไม่มีการป้องกันเลย ให้ลบไฟล์นั้นออกเพื่อเปิดการป้องกันกลับมา"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_ADDED="เพิ่ม IP ของคุณ (%s) เข้ารายการที่เชื่อถือแล้ว"
PLG_SYSTEM_COLORPACK_SHIELD_ADMIN_IP_NOT_ADDED="ไม่ได้เพิ่ม IP ของคุณเข้ารายการที่เชื่อถือ เพราะระบบแยกไม่ออกว่าเป็น IP จริงของคุณ หรือเป็นของ Cloudflare/ตัวกลาง กรุณาเพิ่มเองที่ช่อง IP ที่เชื่อถือได้ หรือตั้งค่า Cloudflare/ตัวกลางให้ถูกต้องก่อน"
PLG_SYSTEM_COLORPACK_SHIELD_KILLSWITCH_TOKEN_LABEL="รหัสลับของไฟล์ปิดฉุกเฉิน (ไม่บังคับ)"
PLG_SYSTEM_COLORPACK_SHIELD_KILLSWITCH_TOKEN_DESC="ถ้าตั้งรหัสนี้ไว้ ไฟล์ฉุกเฉิน colorpack_shield.disable จะปิดการป้องกันได้ก็ต่อเมื่อในไฟล์มีข้อความนี้อยู่ตรงทุกตัวอักษรเท่านั้น ถ้าไม่ตั้งไว้ ไฟล์ชื่อนี้ไฟล์ไหนก็ใช้ปิดได้ทันที การตั้งรหัสช่วยกันไม่ให้คนที่แค่อัปโหลดไฟล์ได้อย่างเดียว ปิดการป้องกันแบบเงียบ ๆ ได้ จดรหัสนี้เก็บไว้ที่ปลอดภัย เพราะต้องใช้ตอนที่คุณถูกล็อกออกจากเว็บตัวเอง"
PLG_SYSTEM_COLORPACK_SHIELD_ALERT_EMAIL_LABEL="อีเมลรับการแจ้งเตือน"
