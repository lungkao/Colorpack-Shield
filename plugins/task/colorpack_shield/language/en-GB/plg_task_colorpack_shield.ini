; Colorpack Shield — task plugin
PLG_TASK_COLORPACK_SHIELD="Task - Colorpack Shield"
PLG_TASK_COLORPACK_SHIELD_XML_DESCRIPTION="Scheduled tasks for Colorpack Shield. Keeps the list of Cloudflare edge IP addresses up to date so the visitor's real IP is recognised correctly."
PLG_TASK_COLORPACK_SHIELD_CFRANGES_TITLE="Colorpack Shield: refresh Cloudflare IP ranges"
PLG_TASK_COLORPACK_SHIELD_CFRANGES_DESC="Downloads Cloudflare's published IP ranges, checks them carefully and stores a signed copy. A failed or suspicious download changes nothing. Weekly is plenty."

PLG_TASK_COLORPACK_SHIELD_FILESCAN_TITLE="Colorpack Shield: scan files for backdoors"
PLG_TASK_COLORPACK_SHIELD_FILESCAN_DESC="Looks through the site's files for common backdoors and PHP files that should not be there. It only reads. It works in short runs and continues at the next run; weekly is plenty. Sends one e-mail when serious findings exist."
PLG_TASK_COLORPACK_SHIELD_FILESCAN_MAIL_SUBJECT="[%s] Colorpack Shield: serious findings in the file scan"
PLG_TASK_COLORPACK_SHIELD_FILESCAN_MAIL_BODY="The scheduled file scan of %1$s found %2$s serious thing(s). The first ones:\n\n%3$s\n\nOpen Components → Colorpack Shield → File scan to see them all and what to do. A finding is something to look at, not proof of a break-in."

PLG_TASK_COLORPACK_SHIELD_SITEMANAGER_TITLE="Colorpack Shield: sync with Site Manager"
PLG_TASK_COLORPACK_SHIELD_SITEMANAGER_DESC="Sends the security score and queued lock-out events to Colorpack Site Manager - only when the 'Site Manager' switch in Colorpack Shield's own settings is on and the Agent plugin is connected. Does nothing otherwise. Every 15 minutes is a reasonable interval; events go out as soon as they are queued, the score at most once a day."
PLG_TASK_COLORPACK_SHIELD_GEMINI_TITLE="Colorpack Shield: Gemini digest"
PLG_TASK_COLORPACK_SHIELD_GEMINI_DESC="Asks Gemini for a digest of the last day's WAF activity - only when both the 'AI (Gemini)' switch and its schedule switch are on in Colorpack Shield's own settings, and throttled to the configured interval regardless of how often this task runs. Does nothing otherwise. Hourly is a reasonable interval to set here; the plugin's own interval setting decides how often a digest actually goes out."
