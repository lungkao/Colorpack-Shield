; Colorpack Shield — task plugin (ภาษาไทย)
PLG_TASK_COLORPACK_SHIELD="Task - Colorpack Shield"
PLG_TASK_COLORPACK_SHIELD_XML_DESCRIPTION="งานตามเวลาของ Colorpack Shield ช่วยอัปเดตรายการ IP ของ Cloudflare เพื่อให้ระบบรู้ IP จริงของผู้เข้าชมได้ถูกต้อง"
PLG_TASK_COLORPACK_SHIELD_CFRANGES_TITLE="Colorpack Shield: อัปเดตรายการ IP ของ Cloudflare"
PLG_TASK_COLORPACK_SHIELD_CFRANGES_DESC="ดาวน์โหลดรายการ IP ที่ Cloudflare เผยแพร่ ตรวจสอบอย่างเข้มงวด แล้วเก็บสำเนาที่ลงลายเซ็นไว้ ถ้าดาวน์โหลดไม่สำเร็จหรือผิดปกติ จะไม่เปลี่ยนอะไรเลย ตั้งสัปดาห์ละครั้งก็เพียงพอ"

PLG_TASK_COLORPACK_SHIELD_FILESCAN_TITLE="Colorpack Shield: สแกนไฟล์หาแบ็คดอร์"
PLG_TASK_COLORPACK_SHIELD_FILESCAN_DESC="ตรวจไฟล์ของเว็บหาแบ็คดอร์ที่พบบ่อยและไฟล์ PHP ที่ไม่ควรมี อ่านอย่างเดียว ทำงานเป็นช่วงสั้น ๆ และต่อในรอบถัดไป ตั้งรายสัปดาห์ก็พอ ส่งอีเมลหนึ่งฉบับเมื่อพบสิ่งร้ายแรง"
PLG_TASK_COLORPACK_SHIELD_FILESCAN_MAIL_SUBJECT="[%s] Colorpack Shield: พบสิ่งร้ายแรงจากการสแกนไฟล์"
PLG_TASK_COLORPACK_SHIELD_FILESCAN_MAIL_BODY="การสแกนไฟล์ตามกำหนดของ %1$s พบสิ่งร้ายแรง %2$s รายการ รายการแรก ๆ:\n\n%3$s\n\nเปิด Components → Colorpack Shield → สแกนไฟล์ เพื่อดูทั้งหมดและวิธีจัดการ สิ่งที่พบเป็นสิ่งที่ควรดู ไม่ใช่หลักฐานการบุกรุก"

PLG_TASK_COLORPACK_SHIELD_SITEMANAGER_TITLE="Colorpack Shield: ส่งข้อมูลให้ Site Manager"
PLG_TASK_COLORPACK_SHIELD_SITEMANAGER_DESC="ส่งคะแนนความปลอดภัยและเหตุการณ์บัญชีถูกล็อกที่ค้างอยู่ไปที่ Colorpack Site Manager - ทำงานเฉพาะเมื่อเปิดสวิตช์ 'Site Manager' ในหน้าตั้งค่าของ Colorpack Shield และเชื่อมต่อปลั๊กอิน Agent ไว้แล้วเท่านั้น ถ้ายังไม่เปิดจะไม่ทำอะไรเลย ตั้งทุก 15 นาทีก็เหมาะสม เหตุการณ์จะถูกส่งทันทีที่เข้าคิว ส่วนคะแนนส่งอย่างมากวันละครั้ง"
PLG_TASK_COLORPACK_SHIELD_GEMINI_TITLE="Colorpack Shield: สรุปผลด้วย Gemini"
PLG_TASK_COLORPACK_SHIELD_GEMINI_DESC="ขอให้ Gemini สรุปเหตุการณ์ WAF ของวันล่าสุด - ทำงานเฉพาะเมื่อเปิดทั้งสวิตช์ 'AI (Gemini)' และสวิตช์สรุปผลตามรอบเวลาในหน้าตั้งค่าของ Colorpack Shield เท่านั้น และถูกจำกัดความถี่ตามค่าที่ตั้งไว้ไม่ว่างานนี้จะรันบ่อยแค่ไหน ถ้ายังไม่เปิดจะไม่ทำอะไรเลย ตั้งทุกชั่วโมงก็เหมาะสม ความถี่จริงที่สรุปผลออกไปขึ้นกับค่าที่ตั้งในปลั๊กอินเอง"
