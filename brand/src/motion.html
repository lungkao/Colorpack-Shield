 [['Files checked','7'],['High','1'],['Medium','0']].forEach((r,i)=>{const t=el('text',{x:912,y:350+i*54,'font-size':22,fill:'#666'},c);t.textContent=r[0];const v=el('text',{x:1180,y:350+i*54,'text-anchor':'end','font-size':30,'font-weight':700,fill:i==1?'#b81b1c':'#2d3236'},c);v.textContent=r[1]});

 el('circle',{cx:HUB[0],cy:HUB[1],r:62,fill:'#fff'},g);[['SITE',-4],['MANAGER',16]].forEach(([w,dy])=>{const h=el('text',{x:HUB[0],y:HUB[1]+dy,'text-anchor':'middle','font-size':17,'font-weight':700,fill:'#1f5fa8'},g);h.textContent=w});

function vis(id,a,b,t,fade=.35){const o=Math.min(ease((t-a)/fade),1-ease((t-(b-fade))/fade));$(id).setAttribute('opacity',clamp(o));return o>0}
function render(t){
 t=clamp(t,0,TOTAL-.001);
 // HUD
 let cur=null;for(const k of ['waf','login','scan','fleet'])if(t>=SC[k][0]&&t<SC[k][1])cur=k;
 $('hud').setAttribute('opacity',cur?clamp(Math.min(ease((t-SC[cur][0])/.4),1-ease((t-(SC[cur][1]-.3))/.3))):0);
 if(cur){const m=META[cur];$('stepno').textContent=m[0];$('title').textContent=m[1];$('cap').textContent=m[2];$('capth').textContent=m[3]}
 // cover: fully visible from the very first frame, fades out as the firewall scene fades in
 $('intro').setAttribute('opacity',clamp(1-ease((t-2.4)/.5)));
 // waf
 if(vis('waf',SC.waf[0],SC.waf[1],t)){const lt=t-SC.waf[0];let n=0;const B=$('bursts');B.textContent='';
  pills.forEach(p=>{const age=lt-p.at-.2;const x=40+age*300;const show=age>0;p.g.setAttribute('opacity',show?1:0);
   const hitX=880-p.w;let px=x;let op=1;
   if(p.bad&&x>=hitX){n++;const d=(x-hitX)/300;op=0;if(d<.5){const c=el('circle',{cx:890,cy:p.y+22,r:20+d*110,fill:'none',stroke:'#ef2b2c','stroke-width':6*(1-d*2),opacity:1-d*2},B)}}
   else if(!p.bad&&x>880){op=clamp(1-(x-880)/260)}
   if(!show)op=0;p.g.setAttribute('opacity',op);p.g.setAttribute('transform',`translate(${px},${p.y})`)});
  $('blocked').textContent='Blocked: '+n;$('wafshield').setAttribute('y',250+Math.sin(lt*6)*0)}
 // login
 if(vis('login',SC.login[0],SC.login[1],t)){const lt=t-SC.login[0];let c=0;for(let i=0;i<5;i++){const on=lt>.35+i*.38;if(on)c++;$('dot'+i).setAttribute('fill',on?'#ef2b2c':'#e1e6eb')}
  $('lmsg').textContent=c?(c<5?'Wrong password ('+c+' of 5)':'Too many failures'):'';
  const k=ease((lt-2.3)/.35);$('lockbar').setAttribute('opacity',k);$('lockico').setAttribute('opacity',k);$('locktxt').setAttribute('opacity',ease((lt-2.45)/.3));$('locksub').setAttribute('opacity',ease((lt-2.7)/.3))}
 // scan
 if(vis('scan',SC.scan[0],SC.scan[1],t)){const lt=t-SC.scan[0];const pos=clamp((lt-.3)/2.1)*FILES.length;$('sweep').setAttribute('y',300+pos*44);$('sweep').setAttribute('opacity',pos<FILES.length?.9:0);
  FILES.forEach((f,i)=>{const done=pos>i+.6;const bad=f[1]==2;$('rb'+i).setAttribute('fill',done&&bad?'#7f1d1d':'#0f3a6b');const s=$('rs'+i);s.textContent=done?(bad?'HIGH':'OK'):'';s.setAttribute('fill',bad?'#fca5a5':'#6cc04a')});
  $('scanres').setAttribute('opacity',ease((lt-2.5)/.4))}
 // fleet
 if(vis('fleet',SC.fleet[0],SC.fleet[1],t)){const lt=t-SC.fleet[0];const A=$('atk'),AT=$('atkt');
  const ax=560+ease(lt/.9)*(N[4][0]-560+38)*1,ay=400+ease(lt/.9)*(N[4][1]-400);
  const hit=lt>.9;A.setAttribute('cx',hit?N[4][0]:ax);A.setAttribute('cy',hit?N[4][1]:ay);A.setAttribute('opacity',lt<1.2?1:clamp(1-(lt-1.2)/.3));AT.setAttribute('opacity',lt<1.2?1:0);AT.setAttribute('x',Math.min(ax,N[4][0])-130+(lt>0?0:0));AT.setAttribute('y',ay-18);
  const pu=$('pulse');if(lt>.9&&lt<1.6){pu.setAttribute('cx',N[4][0]);pu.setAttribute('cy',N[4][1]);pu.setAttribute('r',38+(lt-.9)*70);pu.setAttribute('opacity',1-(lt-.9)/.7)}else pu.setAttribute('opacity',0);
  $('nb4').setAttribute('opacity',ease((lt-1.3)/.3));
  const p0=$('p0'),f=clamp((lt-1.4)/.6);p0.setAttribute('opacity',f>0&&f<1?1:0);p0.setAttribute('cx',N[4][0]+(HUB[0]-N[4][0])*io(f));p0.setAttribute('cy',N[4][1]+(HUB[1]-N[4][1])*io(f));
  for(let i=1;i<5;i++){const n=N[i-1],q=$('q'+i),g=clamp((lt-2.1-i*.08)/.6);q.setAttribute('opacity',g>0&&g<1?1:0);q.setAttribute('cx',HUB[0]+(n[0]-HUB[0])*io(g));q.setAttribute('cy',HUB[1]+(n[1]-HUB[1])*io(g));$('nb'+(i-1)).setAttribute('opacity',ease((lt-2.1-i*.08-.5)/.3))}

}
const q=new URLSearchParams(location.search);
if(q.has('t'))render(parseFloat(q.get('t')));else{const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%TOTAL);requestAnimationFrame(loop)})()}
