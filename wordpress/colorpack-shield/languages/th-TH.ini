PLG_SYSTEM_COLORPACK_SHIELD_IGNORED_HEADERS_LABEL="ส่วนหัวที่ไม่ต้องตรวจ"
PLG_SYSTEM_COLORPACK_SHIELD_IGNORED_HEADERS_DESC="ชื่อส่วนหัวที่ห้ามนำมาตรวจเด็ดขาด บรรทัดละหนึ่งชื่อ ใช้ตอนที่มีบริการที่ถูกต้องบนเว็บของคุณส่งส่วนหัวแปลก ๆ มา แล้วถูกระบบนี้บล็อกโดยเข้าใจผิด"
