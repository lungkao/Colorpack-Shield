PLG_SYSTEM_COLORPACK_SHIELD_PATH_MODE_BLOCK="บล็อกทุกอย่างที่ตรวจพบ"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_LABEL="การสอดส่องหาช่องโหว่"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_PROBE_DESC="คำขอที่พยายามหาสิ่งที่เว็บ Joomla ไม่มีอยู่แล้ว เช่น /.env, /.git/config, path ช่องโหว่เก่า ๆ หรือของ CMS อื่น (/wp-login.php, /xmlrpc.php, path ปลั๊กอิน WordPress), ชื่อไฟล์เว็บเชลล์ และไฟล์สำรองต่าง ๆ — คำขอแบบนี้ไม่มีทางเกิดจากความผิดพลาดของผู้เข้าชมจริง มีแต่เครื่องมือโจมตีเท่านั้น แนะนำให้เริ่มจากโหมด 'บันทึกอย่างเดียว' ก่อน เพื่อดูว่าเว็บของคุณถูกสอดส่องมากแค่ไหน ส่วน 'บล็อกและแบน IP' จะปิดกั้นทุกคำขอถัดไปจาก IP นั้นไปด้วยอีกช่วงเวลาหนึ่ง"
