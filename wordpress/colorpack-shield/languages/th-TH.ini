PLG_SYSTEM_COLORPACK_SHIELD_PATH_ALLOW_LABEL="ลิงก์ที่ไม่ต้องรายงาน"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_ALLOW_DESC="บรรทัดละหนึ่งรายการ บรรทัดที่ขึ้นต้นด้วย / คือคำนำหน้าลิงก์ (เช่น /components/com_pay/notify.php) บรรทัดที่ขึ้นต้นด้วย re: คือรูปแบบค้นหาแบบ regular expression ใช้ได้กับกฎตามตำแหน่งลิงก์เท่านั้น ส่วนการตรวจการไต่ออกนอกโฟลเดอร์และโค้ดแฝงยังทำงานอยู่เสมอ ไม่ว่ากรณีใด"
