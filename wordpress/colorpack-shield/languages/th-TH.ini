PLG_SYSTEM_COLORPACK_SHIELD_PATH_SCAN_DESC="ตรวจเฉพาะส่วนลิงก์ที่ถูกเรียก (ไม่รวมส่วนหลังเครื่องหมาย ?) เพื่อหาการพยายามไต่ออกนอกโฟลเดอร์ด้วย ../ อักขระควบคุมที่ซ่อนอยู่ โค้ดที่แฝงมา ไฟล์ PHP ในโฟลเดอร์อัปโหลด ไฟล์ตกค้างเก่า ๆ และการสอดส่องหาช่องโหว่ ส่วนนี้เห็นได้เฉพาะคำขอที่เข้ามาถึง Joomla เท่านั้น ไฟล์ที่มีอยู่จริงบนดิสก์ เว็บเซิร์ฟเวอร์จะตอบให้ก่อน จึงต้องใช้กฎระดับเซิร์ฟเวอร์ช่วยด้วย (ดูรายละเอียดในเอกสารประกอบ)"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_MODE_LABEL="เมื่อพบสิ่งผิดปกติ"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_MODE_DESC="ค่าแนะนำ: บล็อกเฉพาะการโจมตีที่ชัดเจนมาก (การไต่ออกนอกโฟลเดอร์, อักขระควบคุม, รูปแบบ UTF-8 ที่ผิด, โค้ดที่แฝงมา) ส่วนที่เหลือแค่บันทึกไว้ดู 'บันทึกทุกอย่าง' เป็นวิธีที่ปลอดภัยกว่าตอนเพิ่งลองใช้กับเว็บใหม่"
PLG_SYSTEM_COLORPACK_SHIELD_PATH_MODE_RECOMMENDED="แนะนำ (บล็อกการโจมตีที่ชัดเจน บันทึกส่วนที่เหลือ)"
