PLG_SYSTEM_COLORPACK_SHIELD_MAIL_NEWIP_BODY="ผู้ใช้ %2$s ล็อกอินเข้าหลังบ้านของเว็บ %1$s จาก IP ที่ไม่เคยเห็นมาก่อน: %3$s\nเวลา: %4$s\n\nถ้าเป็นคุณเอง (เปลี่ยนเครือข่าย เดินทาง หรือใช้อุปกรณ์ใหม่) ไม่ต้องทำอะไรเพิ่ม แต่ถ้าไม่ใช่คุณ ให้เปลี่ยนรหัสผ่านทันที เปิดใช้การยืนยันตัวตนหลายปัจจัย และตรวจหาผู้ใช้กับไฟล์ที่ไม่รู้จักเพิ่มเติม"
PLG_SYSTEM_COLORPACK_SHIELD_MAIL_LOCKOUT_SUBJECT="[%s] Colorpack Shield: มี IP ถูกล็อกออกจากหน้าหลังบ้าน"
